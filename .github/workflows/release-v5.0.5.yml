name: Build and release V5.0.5
on:
  push:
    tags: ['v5.0.5']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify release version
        shell: pwsh
        run: |
          python -c "from surface_analyzer import APP_VERSION; assert APP_VERSION == 'V5.0.5', APP_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded targeted regression
        timeout-minutes: 10
        run: python -m pytest -q tests/test_composite_workflow.py tests/test_gap_registration.py tests/test_v467.py tests/test_v471.py tests/test_data_preview.py tests/test_vr_prefix_import.py tests/test_theme.py tests/test_export_origin.py tests/test_judgment.py tests/test_roi_color_domains.py tests/test_shared_color_scale.py tests/test_v473.py --junitxml=release-tests.xml
      - name: Source acceptance
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m surface_analyzer --check-workspace --output-json workspace-check.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m surface_analyzer --check-composite --output-json composite-check.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows installer
        shell: pwsh
        # Targeted checks run above; do not run the documented legacy full suite.
        run: ./scripts/build_release.ps1 -Python python -SkipTests
      - name: Frozen acceptance and provenance
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe=Join-Path $PWD 'dist/SurfaceRxyZxyAnalyzer/SurfaceRxyZxyAnalyzer.exe'
          foreach ($mode in @('workspace','composite')) {
            $output=Join-Path $PWD "frozen-$mode-check.json"
            $p=Start-Process -FilePath $exe -ArgumentList @("--check-$mode",'--output-json',$output) -WindowStyle Hidden -PassThru
            if (!$p.WaitForExit(240000)) { & taskkill /PID $p.Id /T /F; throw 'Frozen check timeout' }
            $p.Refresh()
            if ($p.ExitCode -ne 0) { throw "Frozen $mode failed: $($p.ExitCode)" }
            $r=Get-Content $output -Raw | ConvertFrom-Json
            if ($r.version -ne 'V5.0.5' -or $r.source_commit -ne '${{ github.sha }}') { throw 'Frozen version/source mismatch' }
            if ($mode -eq 'composite' -and !$r.ok) { throw 'Frozen composite protocol failed' }
          }
      - name: Clean installation, upgrade, uninstall and data preservation
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .qa/previous | Out-Null
          gh release download v5.0.4-r1 --pattern 'SurfaceRxyZxyAnalyzer_Setup_V5.0.4.exe' --dir .qa/previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify_release_installation.ps1 -Setup "$PWD/release/SurfaceRxyZxyAnalyzer_Setup_V5.0.5.exe" -PreviousSetup "$PWD/.qa/previous/SurfaceRxyZxyAnalyzer_Setup_V5.0.4.exe" -WorkRoot "$PWD/.qa/installer" -ExpectedCommit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5.0.5-build-results
          path: |
            release/*
            release-tests.xml
            *-check.json
            .qa/installer/*
          include-hidden-files: true
          if-no-files-found: warn
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup='release/SurfaceRxyZxyAnalyzer_Setup_V5.0.5.exe'
          $checksum="$setup.sha256"
          foreach ($path in @($setup,$checksum,'release/update_manifest.json')) {
            if (!(Test-Path $path)) { throw "Missing artifact: $path" }
          }
          $manifest=Get-Content release/update_manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne '${{ github.sha }}') { throw 'Manifest source commit mismatch' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Setup checksum mismatch' }
          gh release view v5.0.5 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v5.0.5 already exists; refusing to overwrite it' }
          gh release create v5.0.5 $setup $checksum release/update_manifest.json --verify-tag --latest --title 'V5.0.5 — 单层导出有效点原点归零' --notes-file docs/RELEASE_NOTES_V5.0.5.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
