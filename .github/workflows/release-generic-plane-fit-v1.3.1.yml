name: Release Generic Plane Fit 1.3.1
on:
  push:
    tags: ['generic-plane-fit-v1.3.1']
permissions:
  contents: write
concurrency:
  group: generic-plane-fit-1.3.1
  cancel-in-progress: true
jobs:
  windows-extension:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Regression against V5.0.9 source host
        timeout-minutes: 8
        run: python -m pytest -q --timeout=90 --timeout-method=thread tests/test_generic_plane_fit.py
      - name: Build only the extension
        shell: pwsh
        run: |
          if (!(Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and !(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./scripts/build_module_extension.ps1 -Id generic-plane-fit
      - name: Verify upgrade with the published V5.0.9 host
        timeout-minutes: 8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-Checked([string]$File, [string[]]$Arguments) {
            $process = Start-Process $File -ArgumentList $Arguments -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(180000)) { & taskkill /PID $process.Id /T /F; throw "Timeout: $File" }
            $process.Refresh()
            if ($process.ExitCode -ne 0) { throw "Exit $($process.ExitCode): $File" }
          }
          New-Item -ItemType Directory -Force .qa/previous | Out-Null
          gh release download v5.0.9 --pattern 'SurfaceRxyZxyAnalyzer_Setup_V5.0.9.exe*' --dir .qa/previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download generic-plane-fit-v1.3.0 --pattern 'SurfaceAnalyzer_GenericPlaneFitExtension_Setup_V1.3.0.exe*' --dir .qa/previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in (Get-ChildItem .qa/previous/*.exe)) {
            $expected = ((Get-Content "$($file.FullName).sha256" -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch: $file" }
          }
          $options = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS')
          $hostPath = "$PWD/.qa/host"
          $extensionPath = "$PWD/.qa/generic-plane-fit"
          Invoke-Checked "$PWD/.qa/previous/SurfaceRxyZxyAnalyzer_Setup_V5.0.9.exe" ($options + @('/CURRENTUSER', "/DIR=`"$hostPath`""))
          Invoke-Checked "$PWD/.qa/previous/SurfaceAnalyzer_GenericPlaneFitExtension_Setup_V1.3.0.exe" ($options + @("/DIR=`"$extensionPath`""))
          if ((Get-Content "$extensionPath/extension.json" -Raw | ConvertFrom-Json).version -ne '1.3.0') { throw 'Baseline extension missing' }
          Invoke-Checked "$PWD/release/SurfaceAnalyzer_GenericPlaneFitExtension_Setup_V1.3.1.exe" ($options + @("/DIR=`"$extensionPath`""))
          $reportPath = "$PWD/.qa/extension-check.json"
          Invoke-Checked "$hostPath/SurfaceRxyZxyAnalyzer.exe" @('--check-module-extension', "`"$extensionPath`"", '--output-json', "`"$reportPath`"")
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (!$report.ok -or $report.app_version -ne 'V5.0.9' -or $report.version -ne '1.3.1') { throw 'Installed extension compatibility check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: generic-plane-fit-1.3.1-verified
          path: |
            release/SurfaceAnalyzer_GenericPlaneFitExtension_Setup_V1.3.1.exe*
            .qa/extension-check.json
          if-no-files-found: error
      - name: Publish extension release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'release/SurfaceAnalyzer_GenericPlaneFitExtension_Setup_V1.3.1.exe'
          gh release create generic-plane-fit-v1.3.1 $setup "$setup.sha256" --verify-tag --latest=false --title '通用三维拟合 1.3.1' --notes-file docs/RELEASE_NOTES_GENERIC_PLANE_FIT_V1.3.1.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
